services:
  webhook:
    build:
      context: .
      dockerfile: Dockerfile.webhook
    image: monitordb-webhook:local
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - monitordb_data:/data

  chat:
    build:
      context: .
      dockerfile: Dockerfile.chat
    image: monitordb-chat:local
    env_file:
      - .env
    volumes:
      - monitordb_data:/data
    stdin_open: true
    tty: true
    profiles:
      - chat

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - webhook

volumes:
  monitordb_data:
  caddy_data:
  caddy_config:

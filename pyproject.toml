[project]
name = "monitordb"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "fastmcp>=3.4.7",
    "google-genai>=2.18.1",
    "pandas>=3.0.5",
    "prompt-toolkit>=3.0.53",
    "pydantic-ai[mcp]>=2.31.0",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "sqlite-vec>=0.1.9",
    "uvicorn>=0.52.3",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "ruff>=0.16.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["monitordb"]